[project]
name = "pgloader-py"
version = "0.1.0"
description = "High-performance MSSQL → PostgreSQL migration tool (pgloader clone)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymssql>=2.3",
    "psycopg[binary]>=3.2",
    "click>=8.1",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.scripts]
pgloader-py = "pgloader_py.cli:main"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]